[package]
name = "grok-chat-core"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Draconitic Labs <support@draconitic.com>"]
homepage = "https://ai.draconitic.com/consilium"
repository = "https://github.com/draconitic-labs/consilium"
description = "Shared provider, routing, and streaming core for Consilium"

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
color-eyre = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "rustls"] }
dotenvy = "0.15"
futures = "0.3"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
