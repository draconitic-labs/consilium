[package]
name = "grok-chat"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Draconitic Labs <support@draconitic.com>"]
homepage = "https://ai.draconitic.com/consilium"
repository = "https://github.com/draconitic-labs/consilium"
description = "Consilium terminal interface for Grok CLI and the optional xAI API"

[[bin]]
name = "grok-chat"
path = "src/main.rs"

[dependencies]
grok-chat-core = { path = "../core" }
tokio = { workspace = true }
tokio-util = { workspace = true }
color-eyre = { workspace = true }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
unicode-width = "0.2"
unicode-segmentation = "1.13.3"
